name: VYRA validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate VYRA
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run local validator
        shell: powershell
        run: |
          & ".\scripts\validate-vyra.ps1" `
            -ProjectRoot $env:GITHUB_WORKSPACE